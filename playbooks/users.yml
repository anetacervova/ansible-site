---
- name: Manage user and SSH keys on bard
  hosts: bard
  become: true

  tasks:
    - name: Ensure user exists
      ansible.builtin.user:
        name: "{{ user_name }}"
        state: present

    - name: Manage authorized SSH keys
      ansible.posix.authorized_key:
        user: "{{ user_name }}"
        key: "{{ user_ssh_keys | join('\n') }}"
        state: present
        exclusive: true
